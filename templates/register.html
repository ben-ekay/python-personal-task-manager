{% extends "base.html" %}

{% block title %}Register | TaskFlow{% endblock %}

{% block content %}
    <main class="auth-page">
        <div class="card auth-card">
            <a href="{{ url_for('home') }}" class="brand auth-brand">
                <span class="brand-icon" aria-hidden="true">✓</span>
                <span class="brand-name">TaskFlow</span>
            </a>

            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">Start organising your tasks in minutes.</p>

            <form method="POST" class="auth-form">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" autocomplete="name" required>
                </div>

                <div class="form-field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="button full-width">
                    Create account
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="{{ url_for('login') }}">Log in</a>
            </p>
        </div>

        <a href="{{ url_for('home') }}" class="auth-back">← Back to home</a>
    </main>
{% endblock %}

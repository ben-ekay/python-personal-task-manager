{% extends "base.html" %}

{% block title %}Login | TaskFlow{% endblock %}

{% block content %}
    <main class="auth-page">
        <div class="card auth-card">
            <a href="{{ url_for('home') }}" class="brand auth-brand">
                <span class="brand-icon" aria-hidden="true">✓</span>
                <span class="brand-name">TaskFlow</span>
            </a>

            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Log in to manage your tasks.</p>

            <form method="POST" class="auth-form">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="button full-width">
                    Log in
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="{{ url_for('register') }}">Create one</a>
            </p>
        </div>

        <a href="{{ url_for('home') }}" class="auth-back">← Back to home</a>
    </main>
{% endblock %}

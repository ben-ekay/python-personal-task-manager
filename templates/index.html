{% extends "base.html" %}

{% block title %}TaskFlow | Personal Task Manager{% endblock %}

{% block content %}
    <header>
        <h1>Personal Task Manager</h1>
        <p>Organise your tasks and track your progress.</p>
    </header>

    <main>
        <section class="hero">
            <h2>Stay organised</h2>
            <p>
                Create, manage and complete your personal tasks in one place.
            </p>

            <div class="actions">
                <a href="{{ url_for('register') }}" class="button">Register</a>
                <a href="{{ url_for('login') }}" class="button secondary">Login</a>
            </div>
        </section>
    </main>
{% endblock %}
